[package]
name = "northstar-ulog"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "North Star structured ULOG JSONL schema, reader, writer and query helpers."

[lib]
name = "northstar_ulog"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
