[package]
name = "northstar-ytd-packer"
version = "0.2.0"
edition = "2021"
build = "build.rs"
description = "North Star XML-free YTD/NEF8 texture dictionary packer and extractor"
license = "MIT"

[dependencies]
blake3 = "1.5"
flate2 = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "bmp", "webp"] }
newengine-texture-container = { path = "../../../EngineRepo/NewEngine/neocore2/crates/newengine-texture-container" }
serde_json = "1.0"

[build-dependencies]
winres = "0.1"

[[bin]]
name = "northstar-ytd-packer"
path = "src/main.rs"
