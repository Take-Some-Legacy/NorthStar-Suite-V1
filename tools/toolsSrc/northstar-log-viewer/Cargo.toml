[package]
name = "northstar-log-viewer"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "North Star first-party ULOG JSONL viewer and exporter."
build = "build.rs"

[dependencies]
northstar-cli = { path = "../../shared/northstar_cli" }
northstar-ulog = { path = "../../shared/northstar_ulog" }
serde_json = "1.0"

[build-dependencies]
winres = "0.1"

[[bin]]
name = "northstar-log-viewer"
path = "src/main.rs"
