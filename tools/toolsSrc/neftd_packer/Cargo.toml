[package]
name = "northstar-neftd-packer"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "North Star .neftd NEF8 font dictionary packer"
license = "MIT"

[dependencies]
blake3 = "1.5"
flate2 = "1.0"
serde_json = "1.0"

[build-dependencies]
winres = "0.1"

[[bin]]
name = "northstar-neftd-packer"
path = "src/main.rs"
