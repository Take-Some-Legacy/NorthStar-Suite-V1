[package]
name = "northstar-ydd-packer"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "North Star NEF8/ListFile drawable dictionary importer for OBJ, glTF, GLB and FBX sources"
license = "MIT"

[dependencies]
base64 = "0.22"
blake3 = "1.5"
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
winres = "0.1"

[[bin]]
name = "northstar-ydd-packer"
path = "src/main.rs"
