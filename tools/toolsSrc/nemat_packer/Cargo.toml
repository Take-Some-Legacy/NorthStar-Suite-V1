[package]
name = "northstar-nemat-packer"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "North Star XMLtype .nemat material library packer, inspector and graph tool"
license = "MIT"

[dependencies]
blake3 = "1.5"
flate2 = "1.0"
serde_json = "1.0"

[build-dependencies]
winres = "0.1"

[lib]
name = "northstar_nemat_packer"
path = "src/lib.rs"

[[bin]]
name = "northstar-nemat-packer"
path = "src/main.rs"
